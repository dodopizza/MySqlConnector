name: "Publish"

on:
  workflow_dispatch:
  push:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Pack
        run: >
          dotnet pack src/MySqlConnector
          --configuration Release
          --output packages
          --version-suffix "${{ github.ref_name }}.1"
          /p:MinVerSkip=true

      - name: Publish
        run: >
          dotnet nuget push ./packages/*.nupkg
          --source https://nuget.pkg.github.com/dodopizza/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
