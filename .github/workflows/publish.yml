name: Publish

on: workflow_dispatch

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Pack
        run: >
          dotnet pack src/MySqlConnector
          --configuration Release
          --output output/packages
          /p:Version=2.2.1-test /p:MinVerSkip=true

      - name: Debug
        run: ls ./output/packages