name: "Publish"

on:
  workflow_dispatch:
  push:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Pack
        run: >
          dotnet pack src/MySqlConnector
          --configuration Release
          --output packages
          --version-suffix "${{ github.ref_name }}"
          /p:MinVerSkip=true

      - name: Publish
        run: >
          dotnet nuget push .\packages\*.nupkg
          --source ${{ secrets.NUGET_SOURCE }}
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Debug
        run: ls ./packages
