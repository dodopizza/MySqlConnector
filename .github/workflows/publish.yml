name: "Publish"

on:
  push:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Generate pack command
        run: >
          echo 'dotnet pack src/MySqlConnector --configuration Release --output packages --version-suffix "${{ github.ref_name }}.${{ github.run_number }}" /p:MinVerSkip=true'

      - name: Generate publish command
        run: echo 'dotnet nuget push ./packages/*.nupkg --source https://nuget.pkg.github.com/dodopizza/index.json --skip-duplicate'
