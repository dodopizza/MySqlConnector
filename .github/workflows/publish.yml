name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Pack
        run: >
          dotnet pack src/MySqlConnector
          --configuration Release
          --output packages
          --version-suffix "${{ github.ref_name }}"
          /p:MinVerSkip=true

      - name: Debug
        run: ls ./packages
